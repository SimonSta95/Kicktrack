<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131417" />
    <title>KickTrack</title>
    <style>
      html, body, #root { margin: 0; min-width: 100%; min-height: 100%; background: #131417; color: #dee4ec; }
      body { min-height: 100vh; overflow: hidden; }
      #boot-splash { min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #131417; }
      #boot-splash > div { display: flex; align-items: center; gap: 10px; color: #a8adb4; font-size: 13px; letter-spacing: .02em; }
      #boot-splash span { width: 8px; height: 8px; border-radius: 999px; background: #ff4600; box-shadow: 0 0 18px rgba(255,70,0,.45); animation: bootPulse 1s ease-in-out infinite alternate; }
      @keyframes bootPulse { from { opacity: .35; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-splash"><div><span></span>KickTrack wird gestartet</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
